<div id="reviewqueue-page">
  <button class="btn-ghost" style="width:auto;padding:8px 14px;margin-bottom:12px;" onclick="backToDashboard()">← Kembali</button>
  <h2>Review Queue</h2>
  <p class="sub">Semua item yang menunggu persetujuan, dari seluruh domain.</p>

  <div class="pill-group" style="margin-bottom:14px;flex-wrap:wrap;">
    <div class="pill active" data-pillar="" onclick="switchReviewPillar('')">Semua</div>
    <div class="pill" data-pillar="Health" onclick="switchReviewPillar('Health')">Health</div>
    <div class="pill" data-pillar="Energy" onclick="switchReviewPillar('Energy')">Energy</div>
    <div class="pill" data-pillar="Safety" onclick="switchReviewPillar('Safety')">Safety</div>
  </div>

  <div class="split-layout">
    <div class="split-list" id="rq-list"><p class="sub">Memuat...</p></div>
    <div class="split-detail" id="rq-detail">
      <p class="sub" style="padding:20px;">Pilih item di sebelah kiri untuk melihat detail.</p>
    </div>
  </div>
</div>

<div id="toast-rq" class="toast"></div>

<script>
  let rqCurrentNik = null;
  let rqAllItems = [];
  let rqSelectedPillar = '';
  let rqSelectedRef = null;

  function initReviewQueue(nik) {
    rqCurrentNik = nik;
    rqSelectedPillar = '';
    document.querySelectorAll('#reviewqueue-page .pill').forEach(function(p, idx) { p.classList.toggle('active', idx === 0); });
    loadReviewQueue();
  }

  function loadReviewQueue() {
    document.getElementById('rq-list').innerHTML = '<p class="sub">Memuat...</p>';
    google.script.run
      .withSuccessHandler(function(items) { rqAllItems = items || []; renderReviewList(); })
      .withFailureHandler(function(err) { showRqToast(err.message || String(err), 'error'); })
      .getUnifiedReviewQueue({ nik: rqCurrentNik });
  }

  function switchReviewPillar(pillar) {
    rqSelectedPillar = pillar;
    document.querySelectorAll('#reviewqueue-page .pill').forEach(function(p) { p.classList.toggle('active', p.dataset.pillar === pillar); });
    renderReviewList();
  }

  function renderReviewList() {
    const filtered = rqSelectedPillar ? rqAllItems.filter(function(i) { return i.pillar === rqSelectedPillar; }) : rqAllItems;
    const el = document.getElementById('rq-list');
    if (!filtered.length) { el.innerHTML = '<p class="sub">Tidak ada item menunggu review.</p>'; return; }

    el.innerHTML = filtered.map(function(i) {
      const activeClass = i.referenceId === rqSelectedRef ? 'active' : '';
      return '<div class="report-row ' + activeClass + '" onclick=\'selectReviewItem(' + JSON.stringify(i) + ')\'>' +
        '<span class="badge-status Pending">' + i.pillar + '</span> <b>' + i.typeLabel + '</b>' +
        '<div class="report-meta">' + i.nama + ' · ' + i.divisi + '</div>' +
        '<div class="report-meta">' + i.timestamp + '</div>' +
      '</div>';
    }).join('');
  }

  function selectReviewItem(item) {
    rqSelectedRef = item.referenceId;
    renderReviewList();

    let detailHtml = '';
    if (item.detail) {
      try {
        const parsed = JSON.parse(item.detail);
        detailHtml = '<div class="card" style="padding:12px;margin-top:10px;">' +
          Object.keys(parsed).map(function(k) {
            const val = parsed[k];
            return '<div class="report-meta"><b>' + k + ':</b> ' + (Array.isArray(val) ? val.join(', ') : val) + '</div>';
          }).join('') + '</div>';
      } catch (e) {}
    }

    document.getElementById('rq-detail').innerHTML =
      '<div style="padding:20px;">' +
        '<span class="badge-status Pending">' + item.pillar + '</span> <b style="font-size:18px;">' + item.typeLabel + '</b>' +
        '<p class="report-meta">' + item.nama + ' (' + item.nik + ') · ' + item.divisi + '</p>' +
        '<p class="report-meta">' + item.timestamp + (item.points ? ' · ' + item.points + ' poin' : '') + '</p>' +
        '<p style="margin-top:10px;">' + (item.title || '') + '</p>' +
        detailHtml +
        (item.buktiUrl ? '<img src="' + item.buktiUrl + '" style="width:100%;border-radius:12px;margin-top:10px;">' : '<p class="sub" style="margin-top:10px;">Tidak ada bukti foto.</p>') +
        '<label style="margin-top:14px;">Feedback (untuk revisi)</label>' +
        '<input type="text" id="rq-fb" placeholder="Tulis feedback...">' +
        '<div style="display:flex;gap:8px;margin-top:10px;">' +
          '<button class="btn-primary" style="margin:0;" onclick="approveReviewItem(\'' + item.source + '\', \'' + item.referenceId + '\')">Setujui</button>' +
          '<button class="btn-primary btn-danger" style="margin:0;" onclick="reviseReviewItem(\'' + item.source + '\', \'' + item.referenceId + '\')">Minta Revisi</button>' +
        '</div>' +
      '</div>';
  }

  function approveReviewItem(source, ref) {
    google.script.run
      .withSuccessHandler(function(res) { showRqToast(res.message, 'success'); loadReviewQueue(); })
      .withFailureHandler(function(err) { showRqToast(err.message || String(err), 'error'); })
      .approveUnifiedReviewItem({ adminNik: rqCurrentNik, source: source, referenceId: ref });
  }

  function reviseReviewItem(source, ref) {
    const fb = document.getElementById('rq-fb').value.trim();
    if (!fb) { showRqToast('Isi feedback dulu.', 'error'); return; }
    google.script.run
      .withSuccessHandler(function(res) { showRqToast(res.message, 'success'); loadReviewQueue(); })
      .withFailureHandler(function(err) { showRqToast(err.message || String(err), 'error'); })
      .reviseUnifiedReviewItem({ adminNik: rqCurrentNik, source: source, referenceId: ref, feedback: fb });
  }

  function showRqToast(msg, type) {
    const t = document.getElementById('toast-rq');
    t.textContent = msg; t.className = 'toast show ' + type;
    if (type !== 'error') setTimeout(function() { t.className = 'toast'; }, 3500);
  }
</script>
