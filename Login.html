<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #10291f 0%, #173a2c 48%, #2c6a4a 100%);
    padding: 24px 16px;
  }
  .login-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 32px 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: var(--shadow);
  }
  .login-logo { font-size: 32px; text-align: center; margin-bottom: 4px; }
  .login-title { text-align: center; font-size: 20px; font-weight: 800; color: var(--green-900); margin: 0; }
  .login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 24px; }
  .login-error {
    display: none;
    background: #fde2de; color: #b3261e;
    padding: 10px 12px; border-radius: 10px;
    font-size: 13px; margin-top: 10px;
  }
  .btn-help {
    width: 100%;
    margin-top: 10px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 14px;
    border-radius: 14px;
    text-decoration: none;
    cursor: pointer;
  }
</style>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🛡️</div>
    <p class="login-title">EHS App</p>
    <p class="login-sub">Environment · Health · Safety</p>
    <label>NIK / Employee ID</label>
    <input id="login-nik" type="text" placeholder="Contoh: 00180 atau MJ00313" autocomplete="off">

    <button class="btn-primary" id="login-btn" onclick="doLogin()">Masuk</button>
    <div class="login-error" id="login-error"></div>
    <button class="btn-ghost" style="width:100%;margin-top:10px;" onclick="showView('register')">Belum punya akun? Daftar di sini</button>
    <a href="https://wa.me/6281234567890" target="_blank" rel="noopener" class="btn-ghost btn-help">
      💬 Chat Admin / Bantuan Login
    </a>
  </div>
</div>

<script>
  function doLogin() {
    const nik = document.getElementById('login-nik').value.trim();
    if (!nik) { loginShowError('NIK wajib diisi.'); return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Memeriksa...';
    document.getElementById('login-error').style.display = 'none';

    verifyAndEnterDashboard(nik, false);

    setTimeout(function() {
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }, 1500);
  }

  function loginShowError(msg) {
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('login-nik').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
