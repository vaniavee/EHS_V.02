<style>
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #10291f 0%, #173a2c 48%, #2c6a4a 100%);
    padding: 20px 12px;
  }
  .login-card {
    background: var(--surface);
    border-radius: 32px;
    padding: 30px 24px;
    width: min(100%, 460px);
    max-width: 460px;
    box-shadow: 0 24px 60px rgba(23, 58, 44, 0.18);
  }
  .login-logo { font-size: 42px; text-align: center; margin-bottom: 8px; }
  .login-title { text-align: center; font-size: 22px; font-weight: 900; color: var(--green-900); margin: 0; }
  .login-sub { text-align: center; color: var(--muted); font-size: 13px; margin: 4px 0 24px; }
  .login-card label { margin-top: 16px; }
  .login-card input {
    min-height: 54px;
    border-radius: 16px;
    border: 1px solid rgba(20, 49, 36, 0.12);
    background: #f7f9f6;
  }
  .login-card input::placeholder { color: #8d9a8f; }
  .login-buttons { display: grid; gap: 12px; margin-top: 16px; }
  .login-error {
    display: none;
    background: #fde2de; color: #b3261e;
    padding: 10px 12px; border-radius: 10px;
    font-size: 13px; margin-top: 10px;
  }
  .btn-help {
    width: 100%;
    margin-top: 10px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    padding: 14px;
    border-radius: 14px;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid rgba(23, 58, 44, 0.08);
    background: rgba(255,255,255,0.92);
    color: var(--green-900);
    font-weight: 700;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn-help:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(23, 58, 44, 0.08); }
  .btn-primary {
    padding: 16px 20px;
    background: linear-gradient(135deg, #1c6a41 0%, #145232 100%);
    box-shadow: 0 18px 28px rgba(28, 106, 65, 0.24);
    border-radius: 16px;
    letter-spacing: 0.02em;
    transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 20px 30px rgba(28, 106, 65, 0.28); }
  .btn-primary:active { transform: translateY(0); }
</style>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🛡️</div>
    <p class="login-title">EHS App</p>
    <p class="login-sub">Environment · Health · Safety</p>
    <label>NIK / Employee ID</label>
    <input id="login-nik" type="text" placeholder="Contoh: 00180 atau MJ00313" autocomplete="off">
    <div id="login-error" class="login-error"></div>

    <div class="login-buttons">
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Masuk Sekarang</button>
      <button class="btn-secondary" onclick="showView('register')">Belum punya akun? Daftar di sini</button>
      <a href="https://wa.me/6281234567890" target="_blank" rel="noopener" class="btn-help">💬 Chat Admin / Bantuan Login</a>
    </div>
  </div>
</div>

<script>
  let loginRequestTimer = null;
  const LOGIN_TIMEOUT_MS = 10000;

  function doLogin() {
    const nikInput = document.getElementById('login-nik');
    const btn = document.getElementById('login-btn');
    const errorEl = document.getElementById('login-error');
    if (!nikInput || !btn || !errorEl) return;

    const nik = nikInput.value.trim();
    if (!nik) { loginShowError('NIK wajib diisi.'); return; }

    btn.disabled = true;
    btn.textContent = 'Memeriksa...';
    errorEl.style.display = 'none';

    loginRequestTimer = setTimeout(function() {
      loginRequestTimer = null;
      btn.disabled = false;
      btn.textContent = 'Masuk Sekarang';
      loginShowError('Permintaan login terlalu lama. Periksa koneksi dan coba lagi.');
    }, LOGIN_TIMEOUT_MS);

    verifyAndEnterDashboard(nik, false);
  }

  function resetLoginButton() {
    const btn = document.getElementById('login-btn');
    if (btn) {
      btn.disabled = false;
      btn.textContent = 'Masuk Sekarang';
    }
    if (loginRequestTimer) {
      clearTimeout(loginRequestTimer);
      loginRequestTimer = null;
    }
  }

  function loginShowError(msg) {
    resetLoginButton();
    const el = document.getElementById('login-error');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.getElementById('login-nik').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });
</script>
