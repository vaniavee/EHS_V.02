<style>
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #10291f 0%, #173a2c 48%, #2c6a4a 100%);
    padding: 24px 16px;
  }
  .login-card {
    background: var(--surface); border-radius: 24px; padding: 32px 24px;
    width: 100%; max-width: 360px; box-shadow: var(--shadow);
  }
</style>

<div class="login-wrap">
  <div class="login-card">
    <div style="font-size:32px;text-align:center;margin-bottom:4px;">📝</div>
    <p style="text-align:center;font-size:20px;font-weight:800;color:var(--green-900);margin:0;">Registrasi Akun</p>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin:4px 0 24px;">Cocokkan data Anda dengan database perusahaan</p>

    <label>NIK</label>
    <input id="reg-nik" type="text" placeholder="Contoh: 00181">
    <label>Nama Lengkap (sesuai data perusahaan)</label>
    <input id="reg-nama" type="text" placeholder="Contoh: Budi Santoso">
    <label>Pilihan Program Awal (opsional)</label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
      <label style="border:1px solid #d9e5dc;border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="pref-health" value="Health"> Health
      </label>
      <label style="border:1px solid #d9e5dc;border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="pref-energy" value="Energy"> Energy
      </label>
      <label style="border:1px solid #d9e5dc;border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="pref-safety" value="Safety"> Safety
      </label>
      <label style="border:1px solid #d9e5dc;border-radius:12px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="pref-sustainability" value="Sustainability"> Sustainability
      </label>
    </div>
    <label>No. WhatsApp (opsional)</label>
    <input id="reg-nowa" type="text" placeholder="Contoh: 081234567890">

    <button class="btn-primary" id="reg-submit-btn" onclick="submitRegister()">Daftar</button>
    <div id="reg-error" style="display:none;background:#fde2de;color:#b3261e;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;"></div>
    <div id="reg-success" style="display:none;background:#e4f3e8;color:var(--green-700);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;"></div>

    <button class="btn-ghost" style="width:100%;margin-top:14px;" onclick="showView('login')">← Kembali ke Login</button>
  </div>
</div>

<script>
  function submitRegister() {
    const nik = document.getElementById('reg-nik').value.trim();
    const nama = document.getElementById('reg-nama').value.trim();
    const noWa = document.getElementById('reg-nowa').value.trim();

    document.getElementById('reg-error').style.display = 'none';
    document.getElementById('reg-success').style.display = 'none';

    if (!nik || !nama) {
      const el = document.getElementById('reg-error');
      el.textContent = 'NIK dan Nama wajib diisi.';
      el.style.display = 'block';
      return;
    }

    const btn = document.getElementById('reg-submit-btn');
    btn.disabled = true; btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = 'Daftar';
        const el = document.getElementById('reg-success');
        el.textContent = res.message;
        el.style.display = 'block';
        setTimeout(function() { showView('login'); }, 2000);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = 'Daftar';
        const el = document.getElementById('reg-error');
        el.textContent = err.message || String(err);
        el.style.display = 'block';
      })
      .registerUser({ nik: nik, nama: nama, noWa: noWa, preferences: preferences });
  }
</script>
