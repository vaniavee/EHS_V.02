<style>
  .register-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #10291f 0%, #173a2c 48%, #2c6a4a 100%);
    padding: 24px 12px;
  }
  .register-card {
    background: var(--surface);
    border-radius: 32px;
    padding: 28px 24px;
    width: min(100%, 480px);
    max-width: 480px;
    box-shadow: 0 24px 60px rgba(23, 58, 44, 0.18);
  }
  .reg-steps { display: flex; gap: 6px; margin-bottom: 20px; }
  .reg-step-dot { flex: 1; height: 4px; border-radius: 999px; background: var(--line); }
  .reg-step-dot.done, .reg-step-dot.active { background: var(--green-900); }
  .reg-program-card {
    width: 100%;
    border: 2px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.18s ease, transform 0.18s ease;
  }
  .reg-program-card:hover { transform: translateY(-1px); }
  .reg-program-card.selected { border-color: var(--green-900); background: var(--surface-2); }
  .reg-program-title { font-weight: 700; margin: 4px 0 2px; }
  .reg-program-desc { font-size: 12px; color: var(--muted); margin: 0; }
  .reg-chip-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .reg-chip {
    flex: 1 1 calc(50% - 10px);
    min-width: 110px;
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .reg-chip.selected { background: var(--green-900); color: #fff; border-color: var(--green-900); }
</style>

<div class="register-wrap">
  <div class="register-card">
    <div class="reg-steps" id="reg-steps">
      <div class="reg-step-dot active" data-step="1"></div>
      <div class="reg-step-dot" data-step="2"></div>
      <div class="reg-step-dot" data-step="3"></div>
    </div>
    <div id="register-step-content"></div>
  </div>
</div>

<script>
  let regNik = null;
  const PROGRAM_OPTIONS = [
    { value: 'EnergyAwareness', title: 'Energy Awareness', desc: 'Belajar, bertindak, dan menciptakan dampak efisiensi energi.', icon: '⚡' },
    { value: 'SafetyParticipation', title: 'Safety Participation', desc: 'Observasi dan kepedulian terhadap keselamatan kerja.', icon: '🛡️' },
    { value: 'HealthyLifestyle', title: 'Healthy Lifestyle', desc: 'Aktivitas, konsistensi, tantangan, dan komunitas sehat.', icon: '❤️' },
    { value: 'SustainabilityJourney', title: 'Sustainability Journey', desc: 'Perjalanan lintas Energy, Safety, dan Health sekaligus.', icon: '🌱', recommended: true }
  ];
  const GOAL_OPTIONS = ['Tetap Aktif', 'Membangun Konsistensi', 'Meningkatkan Stamina', 'Menjadi Lebih Kuat', 'Bergabung dengan Komunitas', 'Berkompetisi dengan Teman'];
  const ACTIVITY_OPTIONS = ['Jalan Kaki', 'Jogging', 'Bersepeda', 'Berenang', 'Gym', 'Senam', 'Yoga', 'Peregangan'];
  const TOPIC_OPTIONS = ['Efisiensi Energi', 'Observasi Safety', 'Kebiasaan Sehat', 'Komunitas', 'Kompetisi', 'Perbaikan Berkelanjutan'];

  function goToStep_(n) {
    document.querySelectorAll('#reg-steps .reg-step-dot').forEach(function(d) {
      const step = Number(d.dataset.step);
      d.classList.toggle('active', step === n);
      d.classList.toggle('done', step < n);
    });
  }

  // ===== STEP 1: NIK + Nama =====
  function renderStep1_() {
    goToStep_(1);
    document.getElementById('register-step-content').innerHTML =
      '<div style="font-size:32px;text-align:center;margin-bottom:4px;">📝</div>' +
      '<p style="text-align:center;font-size:20px;font-weight:800;color:var(--green-900);margin:0;">Registrasi Akun</p>' +
      '<p style="text-align:center;color:var(--muted);font-size:13px;margin:4px 0 24px;">Cocokkan data Anda dengan database perusahaan</p>' +
      '<label>NIK</label><input id="reg-nik" placeholder="Contoh: 00181">' +
      '<label>Nama Lengkap (sesuai data perusahaan)</label><input id="reg-nama" placeholder="Contoh: Budi Santoso">' +
      '<label>No. WhatsApp (opsional)</label><input id="reg-nowa" placeholder="Contoh: 081234567890">' +
      '<button class="btn-primary" id="reg-submit-btn" onclick="submitRegisterStep1()">Daftar Sekarang</button>' +
      '<div id="reg-error" style="display:none;background:#fde2de;color:#b3261e;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;"></div>' +
      '<button class="btn-secondary" style="width:100%;margin-top:12px;" onclick="showView(\'login\')">← Kembali ke Login</button>';
  }

  function submitRegisterStep1() {
    const nik = document.getElementById('reg-nik').value.trim();
    const nama = document.getElementById('reg-nama').value.trim();
    const noWa = document.getElementById('reg-nowa').value.trim();

    if (!nik || !nama) { showRegError_('NIK dan Nama wajib diisi.'); return; }

    const btn = document.getElementById('reg-submit-btn');
    btn.disabled = true; btn.textContent = 'Memproses...';

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = 'Daftar';
        regNik = res.nik;
        if (res.needsPreference) {
          renderStep2_();
        } else {
          renderDone_(res.message);
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = 'Daftar';
        showRegError_(err.message || String(err));
      })
      .registerUser({ nik: nik, nama: nama, noWa: noWa });
  }

  function showRegError_(msg) {
    const el = document.getElementById('reg-error');
    el.textContent = msg; el.style.display = 'block';
  }

  // ===== STEP 2: Pilih Program =====
  let selectedPrograms_ = [];
  function renderStep2_() {
    goToStep_(2);
    selectedPrograms_ = [];
    document.getElementById('register-step-content').innerHTML =
      '<p style="font-size:20px;font-weight:800;color:var(--green-900);margin:0 0 4px;">Pilih Program Anda</p>' +
      '<p class="sub" style="margin:0 0 16px;">Boleh pilih lebih dari satu. Program ini menentukan task mana yang direkomendasikan untuk Anda.</p>' +
      '<div id="reg-program-list">' +
        PROGRAM_OPTIONS.map(function(p) {
          return '<div class="reg-program-card" data-value="' + p.value + '" onclick="toggleProgram_(this)">' +
            '<span style="font-size:20px;">' + p.icon + '</span>' +
            (p.recommended ? '<span class="badge-status Pending" style="margin-left:6px;">Recommended</span>' : '') +
            '<p class="reg-program-title">' + p.title + '</p>' +
            '<p class="reg-program-desc">' + p.desc + '</p>' +
          '</div>';
        }).join('') +
      '</div>' +
      '<button class="btn-primary" onclick="submitStep2_()">Lanjut</button>' +
      '<div id="reg-error2" style="display:none;background:#fde2de;color:#b3261e;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px;"></div>';
  }

  function toggleProgram_(el) {
    el.classList.toggle('selected');
    const val = el.dataset.value;
    if (selectedPrograms_.indexOf(val) === -1) selectedPrograms_.push(val);
    else selectedPrograms_ = selectedPrograms_.filter(function(v) { return v !== val; });
  }

  function submitStep2_() {
    if (!selectedPrograms_.length) {
      const el = document.getElementById('reg-error2');
      el.textContent = 'Pilih minimal 1 program.'; el.style.display = 'block';
      return;
    }
    google.script.run
      .withSuccessHandler(function() { renderStep3_(); })
      .withFailureHandler(function(err) { alert(err.message || String(err)); })
      .saveProgramPreference({ nik: regNik, preferences: selectedPrograms_ });
  }

  // ===== STEP 3: Goals & Interests (opsional) =====
  let selectedGoals_ = [], selectedActivities_ = [], selectedTopics_ = [];
  function renderStep3_() {
    goToStep_(3);
    selectedGoals_ = []; selectedActivities_ = []; selectedTopics_ = [];
    document.getElementById('register-step-content').innerHTML =
      '<p style="font-size:20px;font-weight:800;color:var(--green-900);margin:0 0 4px;">Tujuan & Minat Anda</p>' +
      '<p class="sub" style="margin:0 0 16px;">Opsional — membantu kami memahami preferensi Anda, bukan untuk penilaian klinis.</p>' +
      '<label>Tujuan Pribadi</label>' +
      '<div class="reg-chip-group" id="reg-goals">' + chipListHtml_(GOAL_OPTIONS, 'goal') + '</div>' +
      '<label style="margin-top:16px;">Aktivitas yang Disukai</label>' +
      '<div class="reg-chip-group" id="reg-activities">' + chipListHtml_(ACTIVITY_OPTIONS, 'activity') + '</div>' +
      '<label style="margin-top:16px;">Topik yang Anda Pedulikan</label>' +
      '<div class="reg-chip-group" id="reg-topics">' + chipListHtml_(TOPIC_OPTIONS, 'topic') + '</div>' +
      '<button class="btn-primary" style="margin-top:20px;" onclick="submitStep3_()">Selesai & Lanjut Login</button>' +
      '<button class="btn-ghost" style="width:100%;margin-top:10px;" onclick="submitStep3_(true)">Lewati</button>';
  }

  function chipListHtml_(options, group) {
    return options.map(function(o) {
      return '<div class="reg-chip" data-value="' + o + '" onclick="toggleChip_(this, \'' + group + '\')">' + o + '</div>';
    }).join('');
  }

  function toggleChip_(el, group) {
    el.classList.toggle('selected');
    const val = el.dataset.value;
    const listMap = { goal: 'selectedGoals_', activity: 'selectedActivities_', topic: 'selectedTopics_' };
    const arrName = listMap[group];
    if (window[arrName].indexOf(val) === -1) window[arrName].push(val);
    else window[arrName] = window[arrName].filter(function(v) { return v !== val; });
  }

  function submitStep3_(skip) {
    if (skip) { renderDone_('Registrasi berhasil! Silakan login dengan NIK Anda.'); return; }
    google.script.run
      .withSuccessHandler(function() { renderDone_('Registrasi berhasil! Silakan login dengan NIK Anda.'); })
      .withFailureHandler(function(err) { alert(err.message || String(err)); })
      .saveProfileInterests({ nik: regNik, goals: selectedGoals_, activities: selectedActivities_, topics: selectedTopics_ });
  }

  // ===== DONE =====
  function renderDone_(message) {
    document.getElementById('register-step-content').innerHTML =
      '<div style="font-size:40px;text-align:center;margin-bottom:8px;">✅</div>' +
      '<p style="text-align:center;font-weight:700;color:var(--green-900);">' + message + '</p>' +
      '<p style="text-align:center;color:var(--muted);font-size:13px;margin-top:10px;">Anda akan diarahkan ke login dalam beberapa detik.</p>';
    setTimeout(function() {
      showView('login');
      const loginNik = document.getElementById('login-nik');
      if (loginNik) loginNik.value = '';
      renderStep1_();
    }, 2200);
  }

  // Init saat view register dibuka
  renderStep1_();
</script>
