<div id="pml-page">
  <button class="btn-ghost" style="width:auto;padding:8px 14px;margin-bottom:12px;" onclick="pmlBackToHub()">← Kembali</button>
  <h2 id="pml-title">Missions</h2>
  <p class="sub" id="pml-subtitle"></p>

  <div id="pml-list"><p class="sub">Memuat...</p></div>
</div>

<div id="pml-modal-overlay" class="modal-overlay">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <h3 id="pml-modal-title" style="margin:0;">Isi Data</h3>
      <button class="btn-ghost" style="width:auto;padding:6px 12px;" onclick="pmlCloseModal()">✕</button>
    </div>
    <div id="pml-modal-body"></div>
    <button class="btn-primary" id="pml-modal-submit-btn" onclick="pmlSubmitModal()">Kirim</button>
  </div>
</div>

<div id="toast-pml" class="toast"></div>

<script>
  let pmlCurrentNik = null;
  let pmlCurrentPillar = null;
  let pmlCurrentMode = 'missions';
  let pmlData = null;
  let pmlSelectedMission = null;

  const PML_MODE_META = {
    missions: { title: 'Missions', subtitle: 'Daftar mission yang bisa kamu kerjakan sekarang.' },
    challenges: { title: 'Challenges', subtitle: 'Kumpulan mission dalam satu tantangan.' },
    awareness: { title: 'Awareness', subtitle: 'Media edukasi singkat untuk pilar ini.' }
  };

  // mode: 'missions' | 'challenges' | 'awareness' — masing-masing halaman
  // TUJUAN LANGSUNG, bukan tab yang bisa dipindah-pindah di halaman yang sama.
  function initPillarMissionList(nik, pillar, mode) {
    pmlCurrentNik = nik;
    pmlCurrentPillar = pillar;
    pmlCurrentMode = mode || 'missions';
    const meta = PML_MODE_META[pmlCurrentMode];
    document.getElementById('pml-title').textContent = pillar + ' — ' + meta.title;
    document.getElementById('pml-subtitle').textContent = meta.subtitle;
    pmlLoad();
  }

  function pmlBackToHub() {
    showView('missionhub');
    initMissionHub(pmlCurrentNik, pmlCurrentPillar);
  }

  function pmlLoad() {
    document.getElementById('pml-list').innerHTML = '<p class="sub">Memuat...</p>';
    google.script.run
      .withSuccessHandler(function(data) {
        pmlData = data;
        if (pmlCurrentMode === 'missions') renderPmlMissions_(pmlData.missions);
        if (pmlCurrentMode === 'challenges') renderPmlChallenges_(pmlData.challenge);
        if (pmlCurrentMode === 'awareness') renderPmlAwareness_(pmlData.awareness);
      })
      .withFailureHandler(function(err) { showPmlToast(err.message || String(err), 'error'); })
      .getMissionHubData({ nik: pmlCurrentNik, pillar: pmlCurrentPillar });
  }

  function renderPmlMissions_(missions) {
    const el = document.getElementById('pml-list');
    if (!missions.length) { el.innerHTML = '<p class="sub">Belum ada mission aktif untuk pilar ini.</p>'; return; }
    el.innerHTML = missions.map(function(m) {
      const quota = m.used + '/' + m.limit + ' (' + m.frequencyType + ')';
      const disabled = m.available ? '' : 'disabled';
      const buttonLabel = m.available ? 'Isi Data' : 'Kuota Habis';
      const reasonLine = !m.available && m.reason ? '<div class="report-meta" style="color:var(--danger);margin-top:4px;">' + m.reason + '</div>' : '';
      return '<div class="card" style="padding:14px;margin-bottom:10px;">' + pmlObligationBadge_(m.obligationLevel) +
        '<span class="report-meta" style="margin-left:8px;">[' + m.formType + ']</span><br>' +
        '<b>' + m.title + '</b>' +
        '<div class="report-meta">' + (m.description || '') + '</div>' +
        '<div class="report-meta">Kuota: ' + quota + ' · +' + m.points + ' XP' + (m.coin ? ' · +' + m.coin + ' Coin' : '') + '</div>' +
        (m.safetyWarning ? '<div class="report-meta" style="color:var(--danger);">⚠ ' + m.safetyWarning + '</div>' : '') +
        reasonLine +
        '<button class="btn-primary" style="margin-top:10px;" ' + disabled + ' onclick=\'pmlOpenModal(' + JSON.stringify(m) + ')\'>' + buttonLabel + '</button>' +
      '</div>';
    }).join('');
  }

  function pmlObligationBadge_(level) {
    const map = { Required: { label: 'Wajib', cls: 'Revise' }, Recommended: { label: 'Disarankan', cls: 'Pending' }, Optional: { label: 'Opsional', cls: 'Approved' } };
    const m = map[level] || map.Recommended;
    return '<span class="badge-status ' + m.cls + '" style="margin-bottom:6px;display:inline-block;">' + m.label + '</span><br>';
  }

  function renderPmlChallenges_(challenges) {
    const el = document.getElementById('pml-list');
    if (!challenges.length) { el.innerHTML = '<p class="sub">Belum ada challenge aktif untuk pilar ini.</p>'; return; }
    el.innerHTML = challenges.map(function(c) {
      return '<div class="card" style="padding:14px;margin-bottom:10px;">' +
        '<b>' + c.title + '</b> <span class="report-meta">(' + c.challengeType + ')</span>' +
        '<div class="report-meta">' + (c.description || '') + '</div>' +
        '<div style="background:var(--surface-2);border-radius:8px;height:10px;margin-top:10px;overflow:hidden;">' +
          '<div style="height:100%;width:' + c.progressPct + '%;background:linear-gradient(90deg,#1c6a41,#3ea06a);"></div>' +
        '</div>' +
        '<div class="report-meta" style="margin-top:6px;">' + c.doneCount + '/' + c.totalCount + ' mission selesai (' + c.progressPct + '%)' +
          (c.rewardCoin ? ' · Bonus ' + c.rewardCoin + ' Coin saat lengkap' : '') + '</div>' +
        '<button class="btn-ghost" style="width:auto;margin-top:10px;padding:8px 14px;" onclick="initPillarMissionList(pmlCurrentNik, pmlCurrentPillar, \'missions\')">Lihat Mission Terkait</button>' +
      '</div>';
    }).join('');
  }

  function renderPmlAwareness_(items) {
    const el = document.getElementById('pml-list');
    if (!items.length) { el.innerHTML = '<p class="sub">Belum ada media awareness untuk pilar ini.</p>'; return; }
    el.innerHTML = items.map(function(a) {
      return '<div class="card" style="padding:14px;margin-bottom:10px;">' +
        '<span class="badge-status Pending" style="margin-bottom:6px;display:inline-block;">' + a.contentType + '</span><br>' +
        '<b>' + a.title + '</b>' +
        '<div class="report-meta">' + (a.summary || '') + '</div>' +
        '<div class="report-meta">' + a.estimatedMinutes + ' menit' + (a.lightXp ? ' · +' + a.lightXp + ' Light XP' : '') + '</div>' +
        (a.mediaUrl ? '<a href="' + a.mediaUrl + '" target="_blank" style="display:block;margin-top:8px;font-weight:700;color:var(--green-900);">Buka Media →</a>' : '') +
        '<button class="btn-primary" style="margin-top:10px;" onclick="pmlMarkAwarenessComplete(\'' + a.contentId + '\')">Mark Complete</button>' +
      '</div>';
    }).join('');
  }

  function pmlMarkAwarenessComplete(contentId) {
    google.script.run
      .withSuccessHandler(function(res) { showPmlToast(res.message, 'success'); })
      .withFailureHandler(function(err) { showPmlToast(err.message || String(err), 'error'); })
      .markAwarenessComplete({ nik: pmlCurrentNik, contentId: contentId });
  }

  const PML_LOG_ACTIVITY_TYPES = ['Walking', 'Stretching', 'Cycling', 'Exercise', 'Other'];
  const PML_REDIRECT_PAGES = {
    Quiz: { view: 'energy', fn: 'initEnergyTask', label: 'Halaman Energy Task' },
    SurveyIndividual: { view: 'energy', fn: 'initEnergyTask', label: 'Halaman Energy Task' },
    SurveyGroup: { view: 'energy', fn: 'initEnergyTask', label: 'Halaman Energy Task' },
    MiniProject: { view: 'energy', fn: 'initEnergyTask', label: 'Halaman Energy Task (Mini Project)' },
    SafetyReport: { view: 'safety-report', fn: 'initSafetyReportForm', label: 'Halaman Lapor Safety' },
    ObsIndividual: null, ObsGroup: null // belum ada form-nya sama sekali
  };

  function pmlOpenModal(mission) {
    pmlSelectedMission = mission;
    document.getElementById('pml-modal-title').textContent = mission.title;
    const body = document.getElementById('pml-modal-body');
    const submitBtn = document.getElementById('pml-modal-submit-btn');
    submitBtn.style.display = '';

    if (mission.formType === 'LogActivity') {
      body.innerHTML =
        '<label>Activity Type</label><select id="pml-la-type">' +
          PML_LOG_ACTIVITY_TYPES.map(function(t) { return '<option value="' + t + '">' + t + '</option>'; }).join('') +
        '</select>' +
        '<label>Duration (menit)</label><input id="pml-la-duration" type="number" min="0" placeholder="30">' +
        '<label>Active Minutes</label><input id="pml-la-active" type="number" min="0" placeholder="30">' +
        '<label>Steps (opsional)</label><input id="pml-la-steps" type="number" min="0" placeholder="Optional">' +
        '<label>Distance (km, opsional)</label><input id="pml-la-distance" type="number" min="0" step="0.1" placeholder="Optional">' +
        '<label>Hydration (ml, opsional)</label><input id="pml-la-hydration" type="number" min="0" placeholder="Optional">' +
        '<label>Foto Aktivitas (opsional)</label><input id="pml-la-photo" type="file" accept="image/*" capture="environment">' +
        '<label>Caption (opsional)</label><input id="pml-la-caption" placeholder="Optional community caption">' +
        pmlValidationNote_(mission);
    } else if (mission.formType === 'SubmitMission') {
      body.innerHTML =
        '<label>What did you do?</label><textarea id="pml-sm-desc" placeholder="Describe the action and result"></textarea>' +
        '<label>Location (opsional)</label><input id="pml-sm-location" placeholder="Area / location">' +
        '<label>Evidence URL (opsional)</label><input id="pml-sm-evidenceurl" placeholder="Optional Drive/photo URL">' +
        '<label>Foto Bukti (opsional)</label><input id="pml-sm-photo" type="file" accept="image/*" capture="environment">' +
        '<label>Catatan Tambahan / Refleksi (opsional)</label><textarea id="pml-sm-note" placeholder="Short evidence note"></textarea>' +
        pmlValidationNote_(mission);
    } else if (mission.formType === 'CreateFinding') {
      body.innerHTML =
        '<label>Domain</label><select id="pml-cf-domain">' +
          ['Energy', 'Safety', 'Health', 'Sustainability'].map(function(d) { return '<option value="' + d + '"' + (d === pmlCurrentPillar ? ' selected' : '') + '>' + d + '</option>'; }).join('') +
        '</select>' +
        '<label>Category</label><input id="pml-cf-category" placeholder="Hazard / Leak / Ergonomic / Opportunity">' +
        '<label>Location</label><input id="pml-cf-location" placeholder="Area / unit">' +
        '<label>Description</label><textarea id="pml-cf-desc" placeholder="What is happening and why does it matter?"></textarea>' +
        '<label>Risk / Impact Level</label><select id="pml-cf-risk"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select>' +
        '<label>Evidence URL (opsional)</label><input id="pml-cf-evidenceurl" placeholder="Optional photo/Drive URL">' +
        '<label>Foto Bukti (opsional)</label><input id="pml-cf-photo" type="file" accept="image/*" capture="environment">' +
        '<label>Initial Recommendation (opsional)</label><textarea id="pml-cf-recommendation" placeholder="Safe initial recommendation"></textarea>' +
        pmlValidationNote_(mission);
    } else if (PML_REDIRECT_PAGES.hasOwnProperty(mission.formType)) {
      const target = PML_REDIRECT_PAGES[mission.formType];
      submitBtn.style.display = 'none';
      body.innerHTML = target
        ? '<p class="sub">Mission jenis ini diisi lewat halaman terpisah. Klik tombol di bawah untuk membukanya.</p>' +
          '<button class="btn-primary" onclick="pmlCloseModal(); showView(\'' + target.view + '\'); ' + target.fn + '(pmlCurrentNik);">' + target.label + '</button>'
        : '<p class="sub">Form untuk jenis mission ini (' + mission.formType + ') belum tersedia. Hubungi Admin EHS.</p>';
    } else { // Legacy / fallback
      body.innerHTML =
        '<label>What did you do?</label><textarea id="pml-note" placeholder="Ceritakan apa yang kamu lakukan..."></textarea>' +
        pmlValidationNote_(mission);
    }
    document.getElementById('pml-modal-overlay').classList.add('show');
  }

  function pmlValidationNote_(mission) {
    return mission.validationMethod !== 'Auto'
      ? '<p class="sub" style="margin-top:8px;">Mission ini butuh verifikasi (' + mission.validationMethod + ') — akan masuk antrian review Admin/Supervisor.</p>'
      : '<p class="sub" style="margin-top:8px;">Mission ini auto-approve begitu dikirim.</p>';
  }

  function pmlCloseModal() { document.getElementById('pml-modal-overlay').classList.remove('show'); }

  async function pmlFileToBase64_(inputEl) {
    if (!inputEl || !inputEl.files || !inputEl.files.length) return null;
    const file = inputEl.files[0];
    const base64 = await new Promise(function(resolve, reject) {
      const reader = new FileReader();
      reader.onload = function() { resolve(reader.result.split(',')[1]); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
    return { base64: base64, mime: file.type, name: file.name };
  }

  async function pmlSubmitModal() {
    const btn = document.getElementById('pml-modal-submit-btn');
    btn.disabled = true; btn.textContent = 'Mengirim...';

    const payload = { nik: pmlCurrentNik, missionId: pmlSelectedMission.missionId };
    const formType = pmlSelectedMission.formType;

    if (formType === 'LogActivity') {
      payload.note = document.getElementById('pml-la-caption').value.trim() || pmlSelectedMission.title;
      payload.detail = {
        activityType: document.getElementById('pml-la-type').value,
        durationMinutes: document.getElementById('pml-la-duration').value,
        activeMinutes: document.getElementById('pml-la-active').value,
        steps: document.getElementById('pml-la-steps').value,
        distanceKm: document.getElementById('pml-la-distance').value,
        hydrationMl: document.getElementById('pml-la-hydration').value
      };
      const photo = await pmlFileToBase64_(document.getElementById('pml-la-photo'));
      if (photo) { payload.buktiBase64 = photo.base64; payload.buktiMime = photo.mime; payload.buktiFileName = photo.name; }
    } else if (formType === 'SubmitMission') {
      const desc = document.getElementById('pml-sm-desc').value.trim();
      if (!desc) { showPmlToast('"What did you do?" wajib diisi.', 'error'); btn.disabled = false; btn.textContent = 'Kirim'; return; }
      payload.note = desc;
      payload.detail = {
        location: document.getElementById('pml-sm-location').value.trim(),
        evidenceUrl: document.getElementById('pml-sm-evidenceurl').value.trim(),
        additionalNote: document.getElementById('pml-sm-note').value.trim()
      };
      const photo = await pmlFileToBase64_(document.getElementById('pml-sm-photo'));
      if (photo) { payload.buktiBase64 = photo.base64; payload.buktiMime = photo.mime; payload.buktiFileName = photo.name; }
    } else if (formType === 'CreateFinding') {
      const desc = document.getElementById('pml-cf-desc').value.trim();
      if (!desc) { showPmlToast('Description wajib diisi.', 'error'); btn.disabled = false; btn.textContent = 'Kirim'; return; }
      payload.note = desc;
      payload.detail = {
        domain: document.getElementById('pml-cf-domain').value,
        category: document.getElementById('pml-cf-category').value.trim(),
        location: document.getElementById('pml-cf-location').value.trim(),
        riskLevel: document.getElementById('pml-cf-risk').value,
        evidenceUrl: document.getElementById('pml-cf-evidenceurl').value.trim(),
        initialRecommendation: document.getElementById('pml-cf-recommendation').value.trim()
      };
      const photo = await pmlFileToBase64_(document.getElementById('pml-cf-photo'));
      if (photo) { payload.buktiBase64 = photo.base64; payload.buktiMime = photo.mime; payload.buktiFileName = photo.name; }
    } else {
      payload.note = document.getElementById('pml-note').value.trim();
    }
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = 'Kirim';
        pmlCloseModal();
        showPmlToast(res.message, 'success');
        pmlLoad();
      })
      .withFailureHandler(function(err) {
        btn.disabled = false; btn.textContent = 'Kirim';
        showPmlToast(err.message || String(err), 'error');
      })
      .submitMissionClaim(payload);
  }

  function showPmlToast(msg, type) {
    const t = document.getElementById('toast-pml');
    t.textContent = msg; t.className = 'toast show ' + type;
    if (type !== 'error') setTimeout(function() { t.className = 'toast'; }, 3500);
  }
</script>
