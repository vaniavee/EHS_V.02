<!-- AdminMonitor.html -->
<div id="monitor-page">
  <button class="btn-ghost" style="width:auto;padding:8px 14px;margin-bottom:12px;" onclick="backToDashboard()">← Kembali</button>
  <h2 id="monitor-title">Pantau Task</h2>

  <div class="split-layout">
    <div style="flex:1;">
      <div class="card" style="padding:14px;">
        <div class="filter-row">
          <select id="mon-filter-divisi"><option value="">Semua Divisi</option></select>
          <select id="mon-filter-status">
            <option value="">Semua Status</option>
            <option value="Approved">Approved</option>
            <option value="Pending">Pending</option>
            <option value="Revise">Revise</option>
          </select>
          <div class="date-group">
            <div class="date-wrapper">
              <label>Dari Tanggal</label>
              <div class="date-picker">
                <input id="mon-filter-from" type="text" readonly placeholder="Pilih tanggal" onclick="toggleDatePicker('from')">
                <div class="date-popup" id="mon-filter-from-popup"></div>
              </div>
            </div>
            <div class="date-wrapper">
              <label>Sampai Tanggal</label>
              <div class="date-picker">
                <input id="mon-filter-to" type="text" readonly placeholder="Pilih tanggal" onclick="toggleDatePicker('to')">
                <div class="date-popup" id="mon-filter-to-popup"></div>
              </div>
            </div>
          </div>
          <button class="btn-primary" style="margin:0;width:auto;padding:10px 16px;" onclick="applyMonitorFilter()">Terapkan</button>
          <button class="btn-ghost" style="width:auto;padding:10px 16px;" onclick="resetMonitorFilter()">Reset</button>
        </div>
        <p class="sub" id="monitor-count" style="margin:10px 0 0;"></p>
      </div>

      <div class="table-wrap">
        <table class="data-table" id="monitor-table">
          <thead><tr id="monitor-thead"></tr></thead>
          <tbody id="monitor-tbody"><tr><td class="sub">Memuat...</td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="split-detail" id="monitor-detail" style="flex:1;max-width:420px;">
      <p class="sub" style="padding:20px;">Klik baris dengan status Pending untuk melakukan review.</p>
    </div>
  </div>
</div>

<style>
  .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .filter-row select,
  .filter-row .date-picker input {
    width: 160px;
    flex: 0 0 160px;
    padding: 7px 10px;
    font-size: 13px;
    height: 36px;
    min-height: 36px;
    line-height: 18px;
    box-sizing: border-box;
    border-radius: 12px;
    cursor: pointer;
  }
  .date-wrapper {
    display: flex;
    flex-direction: column;
    gap: 2px;
    width: 160px;
  }
  .date-wrapper label { margin: 0; font-size: 11px; }
  .date-picker { position: relative; }
  .date-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .date-popup {
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    width: 240px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    z-index: 20;
  }
  .date-popup.active { display: block; }
  .date-popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .date-popup-header button {
    border: none;
    background: transparent;
    color: var(--green-900);
    cursor: pointer;
    font-size: 18px;
    width: 28px;
    height: 28px;
    line-height: 28px;
    border-radius: 8px;
  }
  .date-popup-header button:hover { background: var(--surface-2); }
  .date-popup-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    font-size: 12px;
  }
  .date-popup-grid span {
    text-align: center;
    line-height: 24px;
    color: var(--muted);
  }
  .date-popup-grid button {
    border: none;
    background: transparent;
    border-radius: 8px;
    width: 100%;
    height: 28px;
    cursor: pointer;
  }
  .date-popup-grid button:hover { background: var(--surface-2); }
  .date-popup-grid button.selected {
    background: var(--green-900);
    color: #fff;
  }
  .filter-row button {
    margin: 0;
    flex: 0 0 auto;
  }
  .table-wrap { overflow-x: auto; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); margin-top: 14px; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  .data-table th {
    text-align: left; padding: 10px 12px; background: var(--green-900); color: #fff;
    font-weight: 700; position: sticky; top: 0;
  }
  .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .data-table tr:hover td { background: var(--surface-2); }
</style>

<script>
  let monitorCurrentNik = null;
  let monitorCurrentType = null;

  function initAdminMonitor(nik, type) {
    monitorCurrentNik = nik;
    monitorCurrentType = type;
    const titles = { health: 'Pantau Health Task', energy: 'Pantau Energy Task', bmi: 'Data BMI Karyawan' };
    document.getElementById('monitor-title').textContent = titles[type];

    google.script.run
      .withSuccessHandler(function(divisiList) {
        const sel = document.getElementById('mon-filter-divisi');
        sel.innerHTML = '<option value="">Semua Divisi</option>' + divisiList.map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');
      })
      .getDistinctDivisions();

    applyMonitorFilter();
  }

  function resetMonitorFilter() {
    document.getElementById('mon-filter-divisi').value = '';
    document.getElementById('mon-filter-status').value = '';
    document.getElementById('mon-filter-from').value = '';
    document.getElementById('mon-filter-to').value = '';
    applyMonitorFilter();
  }

  function getDateValue(id) {
    const input = document.getElementById(id);
    return input.dataset.value || '';
  }

  function applyMonitorFilter() {
    document.getElementById('monitor-tbody').innerHTML = '<tr><td class="sub">Memuat...</td></tr>';
    google.script.run
      .withSuccessHandler(renderMonitorTable)
      .withFailureHandler(function(err) { alert(err.message || String(err)); })
      .getMonitorDataFiltered({
        nik: monitorCurrentNik, type: monitorCurrentType,
        divisi: document.getElementById('mon-filter-divisi').value,
        status: document.getElementById('mon-filter-status').value,
        dateFrom: getDateValue('mon-filter-from'),
        dateTo: getDateValue('mon-filter-to')
      });
  }

  let datePickerState = {
    from: new Date(),
    to: new Date()
  };

  function toggleDatePicker(field) {
    const popup = document.getElementById('mon-filter-' + field + '-popup');
    const active = popup.classList.toggle('active');
    if (active) {
      renderDatePopup(field);
      closeOtherDatePopup(field);
    }
  }

  function closeOtherDatePopup(openField) {
    ['from', 'to'].forEach(function(field) {
      if (field !== openField) {
        document.getElementById('mon-filter-' + field + '-popup').classList.remove('active');
      }
    });
  }

  function closeDatePopups() {
    ['from', 'to'].forEach(function(field) {
      const el = document.getElementById('mon-filter-' + field + '-popup');
      if (el) el.classList.remove('active');
    });
  }

  document.addEventListener('click', function(event) {
    if (!event.target.closest('.date-picker')) {
      closeDatePopups();
    }
  });

  function renderDatePopup(field) {
    const popup = document.getElementById('mon-filter-' + field + '-popup');
    const stateDate = datePickerState[field];
    const year = stateDate.getFullYear();
    const month = stateDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const startDay = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    let html = '<div class="date-popup-header">'
      + '<button type="button" onclick="changeMonth(\'' + field + '\', -1)">&lsaquo;</button>'
      + '<div>' + firstDay.toLocaleString('default', { month: 'long' }) + ' ' + year + '</div>'
      + '<button type="button" onclick="changeMonth(\'' + field + '\', 1)">&rsaquo;</button>'
      + '</div>';
    html += '<div class="date-popup-grid">';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(function(day) {
      html += '<span>' + day + '</span>';
    });
    for (let i = 0; i < startDay; i++) {
      html += '<span></span>';
    }
    const currentValue = document.getElementById('mon-filter-' + field).dataset.value;
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      const iso = formatIsoDate(date);
      const selected = currentValue === iso ? ' selected' : '';
      html += '<button type="button" class="' + selected + '" onclick="selectDate(\'' + field + '\', ' + year + ', ' + month + ', ' + day + ')">' + day + '</button>';
    }
    html += '</div>';
    popup.innerHTML = html;
  }

  function changeMonth(field, offset) {
    const state = datePickerState[field];
    state.setMonth(state.getMonth() + offset);
    renderDatePopup(field);
  }

  function selectDate(field, year, month, day) {
    const input = document.getElementById('mon-filter-' + field);
    const selectedDate = new Date(year, month, day);
    input.value = formatDisplayDate(selectedDate);
    input.dataset.value = formatIsoDate(selectedDate);
    closeDatePopups();
  }

  function formatIsoDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }

  function formatDisplayDate(date) {
    const d = String(date.getDate()).padStart(2, '0');
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const y = date.getFullYear();
    return d + '/' + m + '/' + y;
  }

function renderMonitorTable(rows) {
  document.getElementById('monitor-count').textContent = rows.length + ' data ditemukan';
  const thead = document.getElementById('monitor-thead');
  const tbody = document.getElementById('monitor-tbody');

  if (monitorCurrentType === 'bmi') {
    thead.innerHTML = '<th>Tanggal</th><th>NIK</th><th>Nama</th><th>Divisi</th><th>BMI</th><th>Kategori</th><th>Poin</th>';
    tbody.innerHTML = rows.length ? rows.map(function(r) {
      return '<tr><td>' + r.Timestamp + '</td><td>' + r.NIK + '</td><td>' + r.Nama + '</td><td>' + r.Divisi +
        '</td><td>' + r.BMI + '</td><td>' + r.Kategori_BMI + '</td><td>' + r.Points + '</td></tr>';
    }).join('') : '<tr><td colspan="7" class="sub">Tidak ada data.</td></tr>';
  } else {
    thead.innerHTML = '<th>Tanggal</th><th>NIK</th><th>Nama</th><th>Divisi</th><th>Task</th><th>Status</th><th>Poin</th>';
    tbody.innerHTML = rows.length ? rows.map(function(r) {
      const clickable = r.Status === 'Pending' && r.ReferenceId;
      const rowStyle = clickable ? 'cursor:pointer;' : '';
      const onclick = clickable ? 'onclick=\'openMonitorReview(' + JSON.stringify(r) + ')\'' : '';
      return '<tr style="' + rowStyle + '" ' + onclick + '><td>' + r.Timestamp + '</td><td>' + r.NIK + '</td><td>' + r.Nama + '</td><td>' + r.Divisi +
        '</td><td>' + r.TaskId + '</td><td><span class="badge-status ' + r.Status + '">' + r.Status + '</span></td><td>' + r.Points + '</td></tr>';
    }).join('') : '<tr><td colspan="7" class="sub">Tidak ada data.</td></tr>';
  }
}

function openMonitorReview(row) {
  let detailHtml = '';
  if (row.Detail) {
    try {
      const parsed = JSON.parse(row.Detail);
      const specialFields = [];
      if (parsed.photoTakenAt) {
        specialFields.push('<div class="report-meta"><b>Tanggal foto:</b> ' + parsed.photoTakenAt + '</div>');
      }
      if (parsed.gpsLat && parsed.gpsLng) {
        specialFields.push('<div class="report-meta"><b>Lokasi foto:</b> <a href="https://www.google.com/maps?q=' + parsed.gpsLat + ',' + parsed.gpsLng + '" target="_blank" rel="noopener">' + parsed.gpsLat + ', ' + parsed.gpsLng + '</a></div>');
      }
      const otherFields = Object.keys(parsed).filter(function(k) {
        return !['photoTakenAt', 'gpsLat', 'gpsLng'].includes(k);
      }).map(function(k) {
        const val = parsed[k];
        return '<div class="report-meta"><b>' + k + ':</b> ' + (Array.isArray(val) ? val.join(', ') : val) + '</div>';
      });
      detailHtml = '<div class="card" style="padding:12px;margin-top:10px;">' + specialFields.concat(otherFields).join('') + '</div>';
    } catch (e) {}
  }

  document.getElementById('monitor-detail').innerHTML =
    '<div style="padding:20px;">' +
      '<span class="badge-status Pending">' + row.Pillar + '</span> <b style="font-size:18px;">' + row.TaskId + '</b>' +
      '<p class="report-meta">' + row.Nama + ' (' + row.NIK + ') · ' + row.Divisi + '</p>' +
      '<p class="report-meta">' + row.Timestamp + ' · ' + row.Points + ' poin</p>' +
      '<p style="margin-top:10px;">' + (row.Note || '') + '</p>' +
      detailHtml +
      (row.BuktiUrl ? '<img src="' + row.BuktiUrl + '" style="width:100%;border-radius:12px;margin-top:10px;">' : '<p class="sub" style="margin-top:10px;">Tidak ada foto bukti.</p>') +
      '<label style="margin-top:14px;">Feedback (untuk revisi)</label>' +
      '<input type="text" id="monitor-fb" placeholder="Tulis feedback...">' +
      '<div style="display:flex;gap:8px;margin-top:10px;">' +
        '<button class="btn-primary" style="margin:0;" onclick="approveMonitorReview(\'' + row.ReferenceId + '\')">Setujui</button>' +
        '<button class="btn-primary btn-danger" style="margin:0;" onclick="reviseMonitorReview(\'' + row.ReferenceId + '\')">Minta Revisi</button>' +
      '</div>' +
    '</div>';
}

function approveMonitorReview(ref) {
  google.script.run
    .withSuccessHandler(function(res) { alert(res.message); applyMonitorFilter(); })
    .withFailureHandler(function(err) { alert(err.message || String(err)); })
    .approveHealthClaim({ adminNik: monitorCurrentNik, referenceId: ref });
}

function reviseMonitorReview(ref) {
  const fb = document.getElementById('monitor-fb').value.trim();
  if (!fb) { alert('Isi feedback dulu.'); return; }
  google.script.run
    .withSuccessHandler(function(res) { alert(res.message); applyMonitorFilter(); })
    .withFailureHandler(function(err) { alert(err.message || String(err)); })
    .reviseHealthClaim({ adminNik: monitorCurrentNik, referenceId: ref, feedback: fb });
}
</script>
