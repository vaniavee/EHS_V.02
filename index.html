  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      const banner = document.createElement('div');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;padding:14px;background:#fde2de;color:#b3261e;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:40vh;overflow:auto;';
      banner.textContent = 'JS ERROR:\n' + message + '\nFile: ' + source + '\nBaris: ' + lineno + ':' + colno;
      document.body.prepend(banner);
      return false;
    };
  </script>
  <?!= include('SharedStyles'); ?>
</head>
<body>
  <div id="view-login"><?!= include('Login'); ?></div>
  <div id="view-register" style="display:none;"><?!= include('Register'); ?></div>
  <div id="view-shell" style="display:none;">
    <?!= include('AppShell'); ?> </div>

  <div id="legacy-views-holder" style="display:none;">
    <div id="view-dashboard"><?!= include('DashboardUser'); ?></div>
    <div id="view-bmi"><?!= include('BmiForm'); ?></div>
    <div id="view-safety-report" ><?!= include('SafetyReport'); ?></div>
    <div id="view-safety-review" ><?!= include('SafetyReviewQueue'); ?></div>
    <div id="view-admin" ><?!= include('DashboardAdmin'); ?></div>
    <div id="view-monitor" ><?!= include('AdminMonitor'); ?></div>
    <div id="view-health" ><?!= include('HealthTask'); ?></div>

    <div id="view-help" ><?!= include('Help'); ?></div>
    <div id="view-admin-help" ><?!= include('AdminHelpQueue'); ?></div>

    <div id="view-reward" ><?!= include('RewardCatalogPage'); ?></div>
    <div id="view-review-queue" style="display:none;"><?!= include('ReviewQueue'); ?></div>

  <script>
    let EHS_CURRENT_NIK = null;
    const EHS_VIEWS = ['login', 'register', 'dashboard', 'bmi', 'safety-report', 'safety-review', 'admin', 'monitor', 'health', 'energy', 'miniproject', 'leaderboard', 'help', 'admin-help', 'missionhub', 'reward', 'review-queue']; // 'task-review'
    //let EHS_CURRENT_NIK = null;
    let EHS_CURRENT_IS_ADMIN = false;

  function showView(name) {
    if (name === 'login' || name === 'register') {
      document.getElementById('view-shell').style.display = 'none';
      document.getElementById('view-login').style.display = name === 'login' ? '' : 'none';
      document.getElementById('view-register').style.display = name === 'register' ? '' : 'none';
      return;
    }
    document.getElementById('view-login').style.display = 'none';
    document.getElementById('view-register').style.display = 'none';
    document.getElementById('view-shell').style.display = '';

    EHS_VIEWS.forEach(function(v) {
      const el = document.getElementById('view-' + v);
      if (el) el.style.display = (v === name) ? '' : 'none';
    });
    setShellActiveNav(name);
  }
    // function showView(name) {
    //   const viewId = 'view-' + name;
    //   const target = document.getElementById(viewId);
    //   if (!target) {
    //     console.warn('View tidak ditemukan:', name);

    //     return;

    //   const allViews = Array.from(document.querySelectorAll('body > div[id^="view-"]'));
    //   allViews.forEach(function(viewEl) {
    //     viewEl.style.display = (viewEl.id === viewId) ? '' : 'none';
    //     viewEl.hidden = viewEl.id !== viewId;
    //   });

    //   target.hidden = false;
    //   target.style.display = '';

    //   if (!EHS_VIEWS.includes(name)) {
    //     EHS_VIEWS.push(name);
    //   }
    // }

    function boot() {
      const savedNik = localStorage.getItem('ehs_nik');
      if (savedNik) {
        verifyAndEnterDashboard(savedNik, true);
      } else {
        showView('login');
      }
    }

    function verifyAndEnterDashboard(nik, silent) {
      google.script.run
        .withSuccessHandler(function(user) {
          if (typeof resetLoginButton === 'function') resetLoginButton();
          EHS_CURRENT_NIK = user.nik;
          EHS_CURRENT_IS_ADMIN = user.isAdmin;
          localStorage.setItem('ehs_nik', user.nik);
          showView('dashboard');
          initAppShell(user);
          loadDashboard(user.nik);
        })
        .withFailureHandler(function(err) {
          if (typeof resetLoginButton === 'function') resetLoginButton();
          localStorage.removeItem('ehs_nik');
          showView('login');
          if (!silent) loginShowError(err.message || String(err));
        })
        .loginUser({ nik: nik });
    }

    function logout() {
      localStorage.removeItem('ehs_nik');
      EHS_CURRENT_NIK = null;
      showView('login');
    }

    /**
     * Router pusat — dipanggil dari klik menu di DashboardUser.html.
     * Setiap halaman tujuan punya fungsi init sendiri (didefinisikan
     * di file HTML masing-masing) yang menerima NIK user yang sedang login.
     */
    function navigateTo(page) {
      const route = {
        bmi: function() { showView('bmi'); initBmiForm(EHS_CURRENT_NIK); },
        health: function() { showView('health'); initHealthTask(EHS_CURRENT_NIK); },
        energy: function() { showView('energy'); initEnergyTask(EHS_CURRENT_NIK); },
        'safety-report': function() { showView('safety-report'); initSafetyReportForm(EHS_CURRENT_NIK); },
        'safety-review': function() { showView('safety-review'); initSafetyReviewQueue(EHS_CURRENT_NIK); },
        admin: function() { showView('admin'); initAdminDashboard(EHS_CURRENT_NIK); },
        'health-monitor': function() { showView('monitor'); initAdminMonitor(EHS_CURRENT_NIK, 'health'); },
        'energy-monitor': function() { showView('monitor'); initAdminMonitor(EHS_CURRENT_NIK, 'energy'); },
        'bmi-monitor': function() { showView('monitor'); initAdminMonitor(EHS_CURRENT_NIK, 'bmi'); },
        leaderboard: function() { showView('leaderboard'); initLeaderboardPage(EHS_CURRENT_NIK); },
        help: function() { showView('help'); initHelpPage(EHS_CURRENT_NIK, EHS_CURRENT_IS_ADMIN); },
        'admin-help': function() { showView('admin-help'); initAdminHelpQueue(EHS_CURRENT_NIK); },
        reward: function() { showView('reward'); initRewardCatalogPage(EHS_CURRENT_NIK); },
        'review-queue': function() { showView('review-queue'); initReviewQueue(EHS_CURRENT_NIK); },
      };

      if (typeof route[page] === 'function') {
        route[page]();
        return;
      }

      alert('Halaman "' + page + '" akan dibuat di tahap berikutnya.');
    }

    
    function backToDashboard() {
      showView('dashboard');
      loadDashboard(EHS_CURRENT_NIK);
    }

    boot();
    document.addEventListener('DOMContentLoaded', function() {
      const holder = document.getElementById('legacy-views-holder');
      const target = document.getElementById('shell-content');
      if (holder && target) {
        while (holder.firstChild) target.appendChild(holder.firstChild);
      }
});
  </script>
</body>
